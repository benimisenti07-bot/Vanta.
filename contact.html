<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Vanta Scaling</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page page--form">
  <header class="nav">
    <div class="nav__identity">
      <div class="nav__brand">Vanta Scaling</div>
      <span class="nav__tagline">Category architects for ascendant brands.</span>
    </div>
    <nav class="nav__links">
      <a href="index.html" class="nav__link">Home</a>
      <a href="qualify.html" class="nav__link">See if you qualify</a>
      <a href="contact.html" class="nav__link nav__link--active">Contact</a>
    </nav>
  </header>

  <main class="form-shell">
    <section class="form-card">
      <h1 class="form-card__title">Let's architect your next chapter.</h1>
      <p class="form-card__subtitle">Tell us about your team, vision, and where you need velocity most. We'll respond with a tailored next step.</p>

      <form id="contactForm" class="form">
        <label class="form__label" for="contactName">Your name</label>
        <input class="form__input" type="text" id="contactName" name="contactName" placeholder="e.g., Morgan Hale" required />

        <label class="form__label" for="contactEmail">Work email</label>
        <input class="form__input" type="email" id="contactEmail" name="contactEmail" placeholder="you@brand.com" required />

        <label class="form__label" for="contactMessage">How can we help?</label>
        <textarea class="form__textarea" id="contactMessage" name="contactMessage" rows="4" placeholder="Share the story." required></textarea>

        <button type="submit" class="btn btn--primary btn--full">Send</button>
        <p class="form__message" id="contactMessageStatus" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer class="footer footer--compact">
    <div class="footer__brand">Vanta Scaling</div>
  </footer>

  <script src="scripts.js"></script>
</body>
</html>
